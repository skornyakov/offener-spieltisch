# Baut die Seite bei jeder Änderung neu und veröffentlicht sie auf GitHub Pages.
# Hier muss normalerweise nichts angepasst werden.
name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Dateien holen
        uses: actions/checkout@v7

      - name: GitHub Pages vorbereiten
        id: pages
        uses: actions/configure-pages@v6

      - name: Hugo installieren
        run: |
          curl -sSL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo mv hugo /usr/local/bin/hugo
          hugo version

      - name: Seite bauen
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Ergebnis hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
